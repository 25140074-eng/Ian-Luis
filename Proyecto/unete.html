<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Únete al cambio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<style>
  body { 
    font-family: 'Roboto', system-ui, sans-serif; 
    background: #f4f4f4; 
    color: #0b3d22; 
}
  header { 
    background-color: #87ceeb; 
    font-weight: 700; 
    color: #0b3d22; 
}
  header a { 
    color: #0b5a26; 
}

  .hero {
    background-color: #0b3d22;
    color: #fff;
    text-align: center;
    padding: 80px 24px;
    min-height: 300px;
  }
  .hero h1 { 
    font-weight: 500; 
    font-size: clamp(28px, 5vw, 46px); 
    max-width: 800px; 
    margin: 0 auto 12px; 
}
  .hero p { 
    max-width: 640px; 
    margin: 0 auto; 
    font-size: 20px; 
    font-weight: 300; 
}

  .seccion { 
    padding: 48px 20px; 
}
  .seccion h2 { 
    text-align: center; 
    color: #0b5a26; 
    margin-bottom: 8px; 
}
  .sub { 
    text-align: center; 
    margin-bottom: 24px; }
  .azul { 
    background: #87ceeb; 
}
  .verde { 
    background: #90ee90; 
}
  .caja { 
    max-width: 560px; 
    margin: 0 auto; 
}

  .tarjeta {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    padding: 24px;
  }
  .campo { 
    margin-bottom: 14px; 
}
  .campo label { 
    display: block; 
    font-weight: 500; 
    margin-bottom: 4px; 
}
  .campo input, .campo select {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    color: #0b3d22;
    background: #fff;
    border: 1px solid #bbb;
    border-radius: 8px;
  }
  .btn-naranja {
    display: block;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 32px;
    background: #ff9100;
    color: #0b3d22;
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
  }
  #mensaje { 
    margin-top: 16px; 
    padding: 14px; 
    border-radius: 12px; 
    text-align: center; 
    font-size: 18px; 
    display: none; 
}
  #mensaje.ok { 
    display: block; 
    background: #90ee90; 
    color: #0b5a26; 
}
  #mensaje.error { 
    display: block; 
    background: #ffd6d6; 
    color: #8a1c1c; 
    }
</style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="container-fluid">
        <img src="logo.png" alt="Logo" width="45" height="45" class="d-inline-block align-text-top">
        NeO Hambryx
        <a href="index.html">Volver al inicio</a>
      </div>
    </nav>
  </header>

  <main>

    <div class="hero">
      <h1>Únete al cambio</h1>
      <p>Cada negocio, comedor o voluntario que se suma ayuda a que rescatemos más comida y lleguemos a más personas.</p>
    </div>

    <section class="seccion verde">
      <h2>Quiero unirme</h2>
      <p class="sub">Déjanos tus datos y te contactamos.</p>

      <form class="caja tarjeta" id="formulario" novalidate>
        <div class="campo">
          <label for="rol">Tu rol</label>
          <select id="rol">
            <option>Restaurante o cadena</option>
            <option>Supermercado o tienda</option>
            <option>Productor o mercado</option>
            <option>Comedor comunitario</option>
            <option>Voluntario</option>
          </select>
        </div>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" autocomplete="name">
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" autocomplete="tel">
        </div>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" autocomplete="email">
        </div>
        <div class="campo">
          <label for="zona">Zona</label>
          <input type="text" id="zona" placeholder="Colonia o ciudad">
        </div>

        <button type="submit" class="btn-naranja">Quiero unirme</button>
        <div id="mensaje" role="alert"></div>
      </form>
    </section>

  </main>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<script>
  const formulario = document.getElementById('formulario');
  const mensaje = document.getElementById('mensaje');

  formulario.addEventListener('submit', (e) => {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const correo = document.getElementById('correo').value.trim();
    const zona = document.getElementById('zona').value.trim();
    const rol = document.getElementById('rol').value;

    // Revisar los datos
    if (!nombre || !zona || (!telefono && !correo)) {
      mensaje.className = 'error';
      mensaje.textContent = 'Escribe tu nombre, tu zona y al menos un teléfono o un correo.';
      return;
    }
    if (correo && !/^\S+@\S+\.\S+$/.test(correo)) {
      mensaje.className = 'error';
      mensaje.textContent = 'Revisa tu correo, parece incompleto.';
      return;
    }

    mensaje.className = 'ok';
    mensaje.textContent = '¡Gracias, ' + nombre + '! Te contactaremos pronto como ' + rol.toLowerCase() + '.';
    formulario.reset();
  });
</script>
</body>
</html>
