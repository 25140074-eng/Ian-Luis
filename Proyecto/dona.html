<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donar excedentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<style>
  body { font-family: 'Roboto', system-ui, sans-serif; background: #f4f4f4; color: #1a1a1a; }
  header { background-color: #87ceeb; font-weight: 700; }

  .donar {
    max-width: 520px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .donar h2 {
    text-align: center;
    color: #0b5a26;
  }
  .donar p.sub {
    text-align: center;
    margin-bottom: 24px;
  }
  .paso {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    padding: 20px;
    margin-bottom: 16px;
  }
  .paso h5 {
    color: #1f7a47;
    margin-bottom: 12px;
  }
  .paso label {
    display: block;
    padding: 6px 0;
    font-size: 18px;
  }
  .paso input[type="number"],
  .paso input[type="time"] {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 8px;
  }
  .btn-naranja {
    display: block;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 32px;
    background: #ff9100;
    color: #1a1a1a;
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
  }
  #mensaje {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    display: none;
  }
  #mensaje.ok { display: block; background: #90ee90; color: #0b5a26; }
  #mensaje.error { display: block; background: #ffd6d6; color: #8a1c1c; }
</style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="container-fluid">
        <img src="logo.png" alt="Logo" width="45" height="45" class="d-inline-block align-text-top">
        NeO Hambryx
        <a href="index.html">Volver al inicio</a>
      </div>
    </nav>
  </header>

  <main class="donar">
    <h2>Dona tus excedentes</h2>
    <p class="sub">Solo tres pasos y listo.</p>

    <form id="formulario">

      <div class="paso">
        <h5>1. Tipo de alimento</h5>
        <label><input type="radio" name="tipo" value="Fresco"> Fresco</label>
        <label><input type="radio" name="tipo" value="Empacado"> Empacado</label>
        <label><input type="radio" name="tipo" value="Preparado"> Preparado</label>
      </div>

      <div class="paso">
        <h5>2. Cantidad</h5>
        <input type="number" id="cantidad" min="1" placeholder="Ej. 20">
        <label><input type="radio" name="unidad" value="porciones" checked> Porciones</label>
        <label><input type="radio" name="unidad" value="kg"> Kilogramos</label>
      </div>

      <div class="paso">
        <h5>3. Hora límite para recoger</h5>
        <input type="time" id="hora">
      </div>

      <button type="submit" class="btn-naranja">Publicar donación</button>
      <div id="mensaje"></div>

    </form>
  </main>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<script>
  const formulario = document.getElementById('formulario');
  const mensaje = document.getElementById('mensaje');

  formulario.addEventListener('submit', (e) => {
    e.preventDefault();

    const tipo = formulario.querySelector('input[name="tipo"]:checked');
    const unidad = formulario.querySelector('input[name="unidad"]:checked').value;
    const cantidad = document.getElementById('cantidad').value;
    const hora = document.getElementById('hora').value;

    // Revisar que todo esté lleno
    if (!tipo || !cantidad || !hora) {
      mensaje.className = 'error';
      mensaje.textContent = 'Falta elegir el tipo, la cantidad y la hora.';
      return;
    }

    mensaje.className = 'ok';
    mensaje.textContent = '¡Gracias! Donación publicada: ' + tipo.value + ', ' +
      cantidad + ' ' + unidad + ', recolección antes de las ' + hora + '.';
    formulario.reset();
  });
</script>
</body>
</html>
